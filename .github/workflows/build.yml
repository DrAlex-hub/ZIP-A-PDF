name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del SDK de Android
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK en: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear el proyecto
        run: |
          mkdir -p Zip2Pdf
          cd Zip2Pdf
          mkdir -p app
          cat > app/build.gradle.kts <<'ZIP2PDF_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.zip2pdf"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.zip2pdf"
                  minSdk = 29          // Android 10+
                  targetSdk = 34
                  versionCode = 5
                  versionName = "2.3"
              }

              // Firma fija: así cada versión nueva se instala encima de la anterior sin desinstalar.
              signingConfigs {
                  create("fija") {
                      storeFile = file("fija.jks")
                      storePassword = "zip2pdf"
                      keyAlias = "zip2pdf"
                      keyPassword = "zip2pdf"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fija")
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          ZIP2PDF_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ZIP2PDF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Sin permisos: no usa Internet ni almacenamiento externo clásico. -->

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Zip2Pdf">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Permite "Abrir con…" desde el gestor de archivos -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/zip" />
                          <data android:mimeType="application/x-zip-compressed" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ZIP2PDF_EOF
          mkdir -p app/src/main/java/com/example/zip2pdf
          cat > app/src/main/java/com/example/zip2pdf/Converter.kt <<'ZIP2PDF_EOF'
          package com.example.zip2pdf

          import android.content.ContentResolver
          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ImageDecoder
          import android.graphics.Paint
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Environment
          import android.provider.DocumentsContract
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.IOException
          import java.nio.ByteBuffer
          import java.util.zip.ZipEntry
          import java.util.zip.ZipException
          import java.util.zip.ZipFile

          /** Nivel de calidad: lado máximo en píxeles y calidad JPEG (0-100). */
          class Preset(val name: String, val maxSide: Int, val quality: Int, val hint: String)

          sealed class Destination {
              object Downloads : Destination()
              object Documents : Destination()
              class Folder(val treeUri: Uri) : Destination()
          }

          /** ZIP ya copiado a la caché de la app, con sus imágenes ordenadas. */
          class ZipSession(val file: File, val zipName: String, val zipBytes: Long, val images: List<String>)

          object Converter {

              val PRESETS = listOf(
                  Preset("Máxima", 4096, 95, "hasta 4096 px · mejor calidad"),
                  Preset("Alta", 2500, 88, "hasta 2500 px · recomendada"),
                  Preset("Media", 1600, 78, "hasta 1600 px · equilibrada"),
                  Preset("Baja", 1000, 65, "hasta 1000 px · archivo ligero")
              )

              private val EXTENSIONS = setOf("webp", "png", "jpg", "jpeg")

              class Result(val fileName: String, val pages: Int, val skipped: Int, val uri: Uri, val bytes: Long)

              private class Page(val jpeg: ByteArray, val width: Int, val height: Int)

              /** Copia el ZIP a la caché privada y lista las imágenes en orden natural. */
              fun open(context: Context, source: Uri): ZipSession {
                  val resolver = context.contentResolver
                  val zipName = displayName(resolver, source) ?: "imagenes.zip"
                  val file = File.createTempFile("zip2pdf_", ".zip", context.cacheDir)
                  try {
                      val input = resolver.openInputStream(source) ?: throw IOException("No se pudo abrir el archivo.")
                      input.use { src -> file.outputStream().use { dst -> src.copyTo(dst) } }

                      val names = ZipFile(file).use { zip ->
                          zip.entries().asSequence()
                              .filter { isImage(it) }
                              .map { it.name }
                              .sortedWith { a, b -> natural(a, b) }
                              .toList()
                      }
                      if (names.isEmpty()) throw IOException("El ZIP no contiene imágenes .webp, .png o .jpg.")
                      return ZipSession(file, zipName, file.length(), names)
                  } catch (e: ZipException) {
                      file.delete()
                      throw IOException("El archivo no parece ser un ZIP válido.")
                  } catch (e: Exception) {
                      file.delete()
                      throw e
                  }
              }

              /**
               * Estima el peso del PDF para cada nivel de calidad: procesa 3 imágenes de muestra
               * (primera, central y última) con los mismos ajustes reales y extrapola al total.
               */
              fun estimate(session: ZipSession): LongArray? {
                  val n = session.images.size
                  val picks = if (n <= 3) (0 until n).toList() else listOf(0, n / 2, n - 1)
                  val sums = LongArray(PRESETS.size)
                  var ok = 0
                  ZipFile(session.file).use { zip ->
                      for (idx in picks) {
                          val entry = zip.getEntry(session.images[idx]) ?: continue
                          val bytes = zip.getInputStream(entry).use { it.readBytes() }
                          val sizes = LongArray(PRESETS.size)
                          var good = true
                          for (i in PRESETS.indices) {
                              val page = renderBytes(bytes, PRESETS[i])
                              if (page == null) {
                                  good = false
                                  break
                              }
                              sizes[i] = page.jpeg.size.toLong()
                          }
                          if (good) {
                              for (i in sizes.indices) sums[i] += sizes[i]
                              ok++
                          }
                      }
                  }
                  if (ok == 0) return null
                  return LongArray(PRESETS.size) { i -> sums[i] / ok * n + n * 700L }
              }

              fun convert(
                  context: Context,
                  session: ZipSession,
                  preset: Preset,
                  dest: Destination,
                  onProgress: (done: Int, total: Int) -> Unit
              ): Result {
                  val resolver = context.contentResolver
                  val pdfName = session.zipName.replace(Regex("\\.zip$", RegexOption.IGNORE_CASE), "") + ".pdf"
                  val target = createTarget(resolver, dest, pdfName)
                  try {
                      var pages = 0
                      var skipped = 0
                      val stream = resolver.openOutputStream(target) ?: throw IOException("No se pudo escribir el PDF.")
                      ZipFile(session.file).use { zip ->
                          PdfWriter(stream).use { pdf ->
                              session.images.forEachIndexed { i, name ->
                                  onProgress(i, session.images.size)
                                  val entry = zip.getEntry(name)
                                  val page = if (entry == null) null else renderEntry(zip, entry, preset)
                                  if (page == null) {
                                      skipped++
                                  } else {
                                      pdf.addPage(page.jpeg, page.width, page.height)
                                      pages++
                                  }
                              }
                              if (pages == 0) throw IOException("No se pudo leer ninguna imagen del ZIP.")
                              pdf.finish()
                          }
                      }
                      onProgress(session.images.size, session.images.size)

                      if (dest !is Destination.Folder) {
                          resolver.update(target, ContentValues().apply {
                              put(MediaStore.MediaColumns.IS_PENDING, 0)
                          }, null, null)
                      }
                      return Result(displayName(resolver, target) ?: pdfName, pages, skipped, target, sizeOf(resolver, target))
                  } catch (e: Exception) {
                      discard(resolver, target, dest)   // no dejar PDFs a medias
                      throw e
                  }
              }

              fun folderName(resolver: ContentResolver, tree: Uri): String? {
                  return try {
                      val doc = DocumentsContract.buildDocumentUriUsingTree(tree, DocumentsContract.getTreeDocumentId(tree))
                      resolver.query(doc, arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0) else null
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              /* ---------------- Destino ---------------- */

              private fun createTarget(resolver: ContentResolver, dest: Destination, name: String): Uri = when (dest) {
                  is Destination.Downloads ->
                      insertMedia(resolver, MediaStore.Downloads.EXTERNAL_CONTENT_URI, Environment.DIRECTORY_DOWNLOADS, name)
                  is Destination.Documents ->
                      insertMedia(resolver, MediaStore.Files.getContentUri("external"), Environment.DIRECTORY_DOCUMENTS, name)
                  is Destination.Folder -> {
                      val parent = DocumentsContract.buildDocumentUriUsingTree(
                          dest.treeUri, DocumentsContract.getTreeDocumentId(dest.treeUri)
                      )
                      DocumentsContract.createDocument(resolver, parent, "application/pdf", name)
                          ?: throw IOException("No se pudo crear el archivo en la carpeta elegida.")
                  }
              }

              private fun insertMedia(resolver: ContentResolver, collection: Uri, dir: String, name: String): Uri {
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, dir)
                      put(MediaStore.MediaColumns.IS_PENDING, 1)
                  }
                  return resolver.insert(collection, values) ?: throw IOException("No se pudo crear el archivo.")
              }

              private fun discard(resolver: ContentResolver, target: Uri, dest: Destination) {
                  try {
                      if (dest is Destination.Folder) {
                          DocumentsContract.deleteDocument(resolver, target)
                      } else {
                          resolver.delete(target, null, null)
                      }
                  } catch (e: Exception) {
                      // nada que hacer
                  }
              }

              /* ---------------- Imágenes ---------------- */

              private fun renderEntry(zip: ZipFile, entry: ZipEntry, preset: Preset): Page? {
                  return try {
                      val bytes = zip.getInputStream(entry).use { it.readBytes() }
                      renderBytes(bytes, preset)
                  } catch (e: Exception) {
                      null
                  }
              }

              /** Decodifica, reduce al tamaño del nivel, dibuja sobre fondo blanco sólido y comprime a JPEG. */
              private fun renderBytes(bytes: ByteArray, preset: Preset): Page? {
                  return try {
                      val decoded = ImageDecoder.decodeBitmap(ImageDecoder.createSource(ByteBuffer.wrap(bytes))) { decoder, info, _ ->
                          decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                          val longest = maxOf(info.size.width, info.size.height)
                          var sample = 1
                          // Decodifica reducido (potencias de 2) sin bajar del tamaño final.
                          while (longest / (sample * 2) >= preset.maxSide) sample *= 2
                          if (sample > 1) decoder.setTargetSampleSize(sample)
                      }

                      val longestDecoded = maxOf(decoded.width, decoded.height)
                      val scale = if (longestDecoded > preset.maxSide) preset.maxSide.toFloat() / longestDecoded else 1f
                      val w = maxOf(1, Math.round(decoded.width * scale))
                      val h = maxOf(1, Math.round(decoded.height * scale))

                      val flat = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(flat)
                      canvas.drawColor(Color.WHITE)                    // fondo blanco: sin transparencias negras
                      canvas.drawBitmap(decoded, null, Rect(0, 0, w, h), Paint(Paint.FILTER_BITMAP_FLAG))
                      decoded.recycle()

                      val buffer = ByteArrayOutputStream(256 * 1024)
                      flat.compress(Bitmap.CompressFormat.JPEG, preset.quality, buffer)
                      val page = Page(buffer.toByteArray(), w, h)
                      flat.recycle()
                      page
                  } catch (e: Exception) {
                      null
                  } catch (e: OutOfMemoryError) {
                      null
                  }
              }

              /* ---------------- Utilidades ---------------- */

              private fun isImage(e: ZipEntry): Boolean {
                  if (e.isDirectory || e.name.startsWith("__MACOSX/")) return false
                  val base = e.name.substringAfterLast('/')
                  if (base.startsWith(".")) return false
                  return base.substringAfterLast('.', "").lowercase() in EXTENSIONS
              }

              private fun displayName(resolver: ContentResolver, uri: Uri): String? {
                  resolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                      if (c.moveToFirst()) return c.getString(0)
                  }
                  return uri.lastPathSegment?.substringAfterLast('/')
              }

              private fun sizeOf(resolver: ContentResolver, uri: Uri): Long {
                  resolver.query(uri, arrayOf(OpenableColumns.SIZE), null, null, null)?.use { c ->
                      if (c.moveToFirst() && !c.isNull(0)) return c.getLong(0)
                  }
                  return -1L
              }

              /** Orden natural: 2.webp va antes que 10.webp; ignora ceros a la izquierda y mayúsculas. */
              private fun natural(a: String, b: String): Int {
                  var i = 0
                  var j = 0
                  while (i < a.length && j < b.length) {
                      if (a[i].isDigit() && b[j].isDigit()) {
                          var ei = i
                          while (ei < a.length && a[ei].isDigit()) ei++
                          var ej = j
                          while (ej < b.length && b[ej].isDigit()) ej++
                          val na = a.substring(i, ei).trimStart('0')
                          val nb = b.substring(j, ej).trimStart('0')
                          if (na.length != nb.length) return na.length - nb.length
                          val c = na.compareTo(nb)
                          if (c != 0) return c
                          i = ei
                          j = ej
                      } else {
                          val c = a[i].lowercaseChar().compareTo(b[j].lowercaseChar())
                          if (c != 0) return c
                          i++
                          j++
                      }
                  }
                  return (a.length - i) - (b.length - j)
              }
          }
          ZIP2PDF_EOF
          cat > app/src/main/java/com/example/zip2pdf/MainActivity.kt <<'ZIP2PDF_EOF'
          package com.example.zip2pdf
          
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.text.SpannableString
          import android.text.style.ForegroundColorSpan
          import android.view.View
          import android.widget.Button
          import android.widget.ProgressBar
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Locale
          import java.util.concurrent.Executors
          
          class MainActivity : AppCompatActivity() {
              private val executor = Executors.newSingleThreadExecutor()
              private var busy = false
              private var generation = 0
              private var sessions: List<ZipSession> = emptyList()
              private var estimates: LongArray? = null
              private var estimating = false
              private var lastPdf: Uri? = null
              private var treeUri: Uri? = null
          
              private lateinit var prefs: SharedPreferences
              private lateinit var btnPick: Button
              private lateinit var btnCreate: Button
              private lateinit var btnFolder: Button
              private lateinit var btnOpen: Button
              private lateinit var tvZip: TextView
              private lateinit var tvEstimate: TextView
              private lateinit var tvFolder: TextView
              private lateinit var tvStatus: TextView
              private lateinit var bar: ProgressBar
              private lateinit var rgQuality: RadioGroup
              private lateinit var rgDest: RadioGroup
              private lateinit var qualityButtons: List<RadioButton>
          
              private val qualityIds = listOf(R.id.q0, R.id.q1, R.id.q2, R.id.q3)
              private val destIds = listOf(R.id.d_downloads, R.id.d_documents, R.id.d_folder)
          
              private val zipPicker = registerForActivityResult(ActivityResultContracts.OpenMultipleDocuments()) { uris ->
                  if (!uris.isNullOrEmpty()) loadZips(uris.take(100))
              }
              private val folderPicker = registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri ->
                  if (uri != null) onFolderChosen(uri)
              }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  prefs = getSharedPreferences("ajustes", MODE_PRIVATE)
                  btnPick = findViewById(R.id.btnPick)
                  btnCreate = findViewById(R.id.btnCreate)
                  btnFolder = findViewById(R.id.btnFolder)
                  btnOpen = findViewById(R.id.btnOpen)
                  tvZip = findViewById(R.id.tvZip)
                  tvEstimate = findViewById(R.id.tvEstimate)
                  tvFolder = findViewById(R.id.tvFolder)
                  tvStatus = findViewById(R.id.tvStatus)
                  bar = findViewById(R.id.bar)
                  rgQuality = findViewById(R.id.rgQuality)
                  rgDest = findViewById(R.id.rgDest)
                  qualityButtons = qualityIds.map { findViewById<RadioButton>(it) }
                  val title = SpannableString("ZIP → PDF")
                  title.setSpan(ForegroundColorSpan(Color.parseColor("#E53935")), 4, 5, 0)
                  findViewById<TextView>(R.id.title).text = title
                  rgQuality.check(qualityIds[prefs.getInt("quality", 1).coerceIn(0, 3)])
                  rgDest.check(destIds[prefs.getInt("dest", 0).coerceIn(0, 2)])
                  treeUri = prefs.getString("tree", null)?.let { Uri.parse(it) }?.takeIf { saved ->
                      contentResolver.persistedUriPermissions.any { it.uri == saved && it.isWritePermission }
                  }
                  rgQuality.setOnCheckedChangeListener { _, _ ->
                      prefs.edit().putInt("quality", selectedPreset()).apply()
                      refreshLabels()
                  }
                  rgDest.setOnCheckedChangeListener { _, _ ->
                      prefs.edit().putInt("dest", destIndex()).apply()
                      updateFolderUi()
                      if (destIndex() == 2 && treeUri == null) folderPicker.launch(null)
                  }
                  btnPick.setOnClickListener {
                      zipPicker.launch(arrayOf("application/zip", "application/x-zip-compressed", "application/octet-stream"))
                  }
                  btnFolder.setOnClickListener { folderPicker.launch(null) }
                  btnCreate.setOnClickListener { startConvert() }
                  btnOpen.setOnClickListener { openPdf() }
                  updateFolderUi()
                  refreshLabels()
                  refreshButtons()
                  if (savedInstanceState == null && intent?.action == Intent.ACTION_VIEW) {
                      intent.data?.let { loadZips(listOf(it)) }
                  }
              }
          
              private fun loadZips(uris: List<Uri>) {
                  if (busy) return
                  val gen = ++generation
                  sessions.forEach { it.file.delete() }
                  sessions = emptyList()
                  estimates = null
                  estimating = false
                  lastPdf = null
                  btnOpen.visibility = View.GONE
                  tvZip.text = "Leyendo ${uris.size} ZIP${if (uris.size == 1) "" else "s"}…"
                  setStatus("Preparando archivos…")
                  setBusy(true)
                  refreshLabels()
                  val app = applicationContext
                  executor.execute {
                      val loaded = mutableListOf<ZipSession>()
                      val failures = mutableListOf<String>()
                      uris.forEachIndexed { index, uri ->
                          try {
                              loaded.add(Converter.open(app, uri))
                              runOnUiThread {
                                  if (gen == generation) setStatus("Leyendo ZIP ${index + 1} de ${uris.size}…")
                              }
                          } catch (e: Exception) {
                              failures.add("${index + 1}: ${e.message ?: "archivo no válido"}")
                          }
                      }
                      val est = if (loaded.size == 1) try { Converter.estimate(loaded[0]) } catch (_: Exception) { null } else null
                      runOnUiThread {
                          if (gen != generation) {
                              loaded.forEach { it.file.delete() }
                              return@runOnUiThread
                          }
                          sessions = loaded
                          estimates = est
                          estimating = false
                          tvZip.text = if (loaded.isEmpty()) "Ningún archivo válido" else
                              loaded.joinToString("\n") { "• ${it.zipName} · ${it.images.size} imágenes · ${formatSize(it.zipBytes)}" }
                          val summary = "${loaded.size} ZIP listos para convertir" + if (failures.isNotEmpty()) "\n${failures.size} archivo(s) no se pudieron leer." else ""
                          setStatus(summary, loaded.isEmpty())
                          refreshLabels()
                          setBusy(false)
                      }
                  }
              }
          
              private fun startConvert() {
                  val batch = sessions.toList()
                  if (batch.isEmpty() || busy) return
                  val dest: Destination
                  val label: String
                  when (destIndex()) {
                      0 -> { dest = Destination.Downloads; label = "Descargas" }
                      1 -> { dest = Destination.Documents; label = "Documentos" }
                      else -> {
                          val t = treeUri
                          if (t == null) {
                              setStatus("Elige primero una carpeta con el botón «Elegir carpeta».", true)
                              return
                          }
                          dest = Destination.Folder(t)
                          label = Converter.folderName(contentResolver, t) ?: "la carpeta elegida"
                      }
                  }
                  val preset = Converter.PRESETS[selectedPreset()]
                  val app = applicationContext
                  lastPdf = null
                  btnOpen.visibility = View.GONE
                  setStatus("Preparando conversión…")
                  setBusy(true)
                  executor.execute {
                      val successes = mutableListOf<Converter.Result>()
                      val failures = mutableListOf<String>()
                      batch.forEachIndexed { zipIndex, session ->
                          try {
                              val result = Converter.convert(app, session, preset, dest) { done, total ->
                                  runOnUiThread {
                                      bar.isIndeterminate = false
                                      bar.max = total.coerceAtLeast(1)
                                      bar.progress = done
                                      setStatus("ZIP ${zipIndex + 1} de ${batch.size}: imagen ${minOf(done + 1, total)} de $total\n${session.zipName}")
                                  }
                              }
                              successes.add(result)
                          } catch (e: Exception) {
                              failures.add("${session.zipName}: ${e.message ?: "error de conversión"}")
                          }
                      }
                      runOnUiThread {
                          if (successes.size == 1 && failures.isEmpty()) {
                              lastPdf = successes[0].uri
                              btnOpen.visibility = View.VISIBLE
                          }
                          val pages = successes.sumOf { it.pages }
                          val size = successes.sumOf { it.bytes }
                          val msg = buildString {
                              append("Proceso terminado: ${successes.size} de ${batch.size} PDF creados.\n")
                              append("$pages páginas · ${formatSize(size)} en total.\nGuardado en $label.")
                              successes.forEach { append("\n✓ ${it.fileName}") }
                              failures.forEach { append("\n✗ $it") }
                              successes.filter { it.skipped > 0 }.forEach { append("\n${it.fileName}: se omitieron ${it.skipped} imágenes ilegibles.") }
                              if (successes.size > 1) append("\nCada ZIP se convirtió en un PDF independiente.")
                          }
                          setStatus(msg, failures.isNotEmpty() || successes.isEmpty())
                          setBusy(false)
                      }
                  }
              }
          
              private fun openPdf() {
                  val uri = lastPdf ?: return
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/pdf")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try { startActivity(intent) } catch (_: ActivityNotFoundException) {
                      Toast.makeText(this, "No hay ninguna app para abrir PDF.", Toast.LENGTH_LONG).show()
                  }
              }
          
              private fun onFolderChosen(uri: Uri) {
                  try {
                      contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                  } catch (_: SecurityException) { }
                  treeUri = uri
                  prefs.edit().putString("tree", uri.toString()).apply()
                  updateFolderUi()
              }
          
              private fun updateFolderUi() {
                  val visible = if (destIndex() == 2) View.VISIBLE else View.GONE
                  btnFolder.visibility = visible
                  tvFolder.visibility = visible
                  val t = treeUri
                  tvFolder.text = if (t != null) "Carpeta: " + (Converter.folderName(contentResolver, t) ?: "elegida") else "Ninguna carpeta elegida"
                  btnFolder.text = if (t != null) "Cambiar carpeta" else "Elegir carpeta"
              }
          
              private fun selectedPreset(): Int {
                  val i = qualityIds.indexOf(rgQuality.checkedRadioButtonId)
                  return if (i < 0) 1 else i
              }
              private fun destIndex(): Int {
                  val i = destIds.indexOf(rgDest.checkedRadioButtonId)
                  return if (i < 0) 0 else i
              }
              private fun refreshLabels() {
                  val est = estimates
                  for (i in Converter.PRESETS.indices) {
                      val p = Converter.PRESETS[i]
                      val extra = when {
                          est != null -> "  ·  ~" + formatSize(est[i])
                          estimating -> "  ·  calculando…"
                          else -> ""
                      }
                      qualityButtons[i].text = "${p.name}\n${p.hint}$extra"
                  }
                  tvEstimate.text = when {
                      sessions.isEmpty() -> "Elige hasta 100 ZIPs; cada uno generará su propio PDF."
                      sessions.size > 1 -> "${sessions.size} ZIP seleccionados. El peso final depende de cada archivo."
                      est != null -> "Peso estimado del PDF: ~" + formatSize(est[selectedPreset()])
                      else -> "Un PDF independiente por cada ZIP seleccionado."
                  }
              }
              private fun refreshButtons() {
                  btnPick.isEnabled = !busy
                  btnCreate.isEnabled = !busy && sessions.isNotEmpty()
              }
              private fun setBusy(b: Boolean) {
                  busy = b
                  if (b) {
                      bar.visibility = View.VISIBLE
                      bar.isIndeterminate = true
                  } else bar.visibility = View.GONE
                  refreshButtons()
              }
              private fun setStatus(msg: String, error: Boolean = false) {
                  tvStatus.text = msg
                  tvStatus.setTextColor(Color.parseColor(if (error) "#FF6B6B" else "#A0A0A0"))
              }
              private fun formatSize(bytes: Long): String = when {
                  bytes < 0 -> "?"
                  bytes < 1024L * 1024L -> String.format(Locale.getDefault(), "%.0f KB", bytes / 1024.0)
                  bytes < 1024L * 1024L * 1024L -> String.format(Locale.getDefault(), "%.1f MB", bytes / 1048576.0)
                  else -> String.format(Locale.getDefault(), "%.2f GB", bytes / 1073741824.0)
              }
              override fun onDestroy() {
                  super.onDestroy()
                  if (isFinishing) {
                      executor.shutdown()
                      sessions.forEach { it.file.delete() }
                  }
              }
          }
