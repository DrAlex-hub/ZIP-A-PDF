          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp Zip2Pdf/app/build/outputs/apk/debug/app-debug.apk ZIP-a-PDF.apk
          gh release create "apk-${{ github.run_id }}" ZIP-a-PDF.apk --repo "$GITHUB_REPOSITORY" --title "ZIP a PDF v2 (compilación ${{ github.run_number }})" --notes "APK listo para instalar. Se instala encima de la versión anterior de esta misma serie."
